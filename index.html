<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIPHER</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root {
    --bg:#f5f5f7;
    --surface:#ffffff;
    --surface2:#f5f5f7;
    --border:#d2d2d7;
    --text:#1d1d1f;
    --text2:#6e6e73;
    --text3:#86868b;
    --blue:#0066cc;
    --blue-hover:#0077ed;
    --blue-light:rgba(0,102,204,0.08);
    --red:#ff3b30;
    --green:#34c759;
    --orange:#ff9500;
    --radius:12px;
    --radius-sm:8px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
    background:var(--bg);color:var(--text);
    min-height:100vh;padding:2.5rem 1rem 5rem;
    display:flex;flex-direction:column;align-items:center;
    -webkit-font-smoothing:antialiased;
  }

  /* HEADER */
  .hdr{
    width:100%;max-width:560px;
    display:flex;align-items:center;justify-content:center;
    padding-bottom:16px;margin-bottom:0;
  }
  canvas#dog{image-rendering:pixelated;width:64px;height:64px;}

  /* CARD */
  .card{
    width:100%;max-width:560px;
    background:var(--surface);
    border-radius:18px;
    box-shadow:0 2px 20px rgba(0,0,0,.08), 0 1px 4px rgba(0,0,0,.04);
    overflow:hidden;
  }

  /* LOCK OVERLAY */
  #lock-overlay{
    display:none;position:fixed;inset:0;z-index:999;
    background:rgba(0,0,0,0.5);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    align-items:center;justify-content:center;flex-direction:column;gap:12px;
  }
  #lock-overlay.show{display:flex;}
  #lock-box{
    background:var(--surface);border-radius:20px;
    padding:2.2rem 2.8rem;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
    min-width:260px;
  }
  #lock-title{font-size:17px;font-weight:600;color:var(--red);margin-bottom:6px;letter-spacing:-.01em;}
  #lock-timer{font-size:36px;font-weight:300;letter-spacing:-.02em;color:var(--text);margin:8px 0;}
  #lock-sub{font-size:12px;color:var(--text3);line-height:1.5;}

  /* TYPE TOGGLE */
  .type-toggle{
    display:flex;padding:10px;gap:6px;
    border-bottom:1px solid var(--border);
    background:var(--surface2);
  }
  .type-btn{
    flex:1;padding:9px 12px;
    font-family:inherit;font-size:13px;font-weight:500;
    border:1.5px solid transparent;background:transparent;color:var(--text2);cursor:pointer;
    border-radius:var(--radius-sm);transition:all .15s;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .type-btn.on{
    background:var(--surface);color:var(--text);
    border-color:var(--border);
    box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
  .type-btn:hover:not(.on){background:rgba(0,0,0,.04);color:var(--text);}

  /* ACTION HINT */
  .action-hint{
    display:flex;align-items:center;gap:10px;
    padding:12px 20px;
    border-bottom:1px solid var(--border);
    min-height:48px;
  }
  .action-badge{
    font-size:11px;font-weight:600;letter-spacing:.04em;
    padding:3px 9px;border-radius:980px;
    flex-shrink:0;
  }
  .action-badge.enc{background:rgba(0,102,204,.1);color:var(--blue);}
  .action-badge.dec{background:rgba(52,199,89,.12);color:#1a7a33;}
  .action-badge.idle{background:var(--border);color:var(--text3);}
  .action-desc{font-size:12px;color:var(--text3);line-height:1.4;}

  /* BODY */
  .body{padding:20px;}
  .field{margin-bottom:16px;}
  .lbl{
    font-size:12px;font-weight:500;
    color:var(--text2);margin-bottom:6px;
    display:block;
  }

  textarea,input.ipt{
    width:100%;font-family:inherit;
    font-size:14px;color:var(--text);background:var(--surface2);
    border:1.5px solid var(--border);border-radius:var(--radius-sm);
    padding:10px 13px;outline:none;
    line-height:1.6;transition:border-color .15s,box-shadow .15s;
  }
  textarea{resize:vertical;min-height:76px;}
  textarea:focus,input.ipt:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(0,102,204,.12);
    background:var(--surface);
  }
  textarea::placeholder,input.ipt::placeholder{color:var(--text3);}

  /* plaintext */
  .pt-field{position:relative;}
  .pt-field textarea{min-height:44px;}
  .pt-hint{display:none;}
  textarea#unified-input.masked-cipher-input{
    color:transparent;caret-color:var(--text);
  }
  .pt-field:focus-within .cipher-mask{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(0,102,204,.12);
  }

  textarea.ro{
    background:var(--surface2);cursor:default;
    word-break:break-all;min-height:60px;color:var(--text2);resize:none;
  }
  textarea#pout{
    min-height:44px;max-height:44px;overflow:auto;
    background:var(--surface2);resize:none;word-break:break-all;
  }
  textarea#cout,textarea#cin{
    min-height:44px;max-height:44px;overflow:auto;resize:none;
    word-break:break-all;
  }
  .cipher-wrap{position:relative;}
  .cipher-mask{
    position:absolute;inset:0;pointer-events:none;
    font-family:inherit;font-size:14px;
    padding:10px 13px;line-height:1.6;
    color:var(--text);background:var(--surface2);
    border:1.5px solid var(--border);border-radius:var(--radius-sm);
    word-break:break-all;overflow:hidden;white-space:pre-wrap;
  }
  .cipher-mask.ro-mask{background:var(--surface2);}
  textarea#cout{color:transparent;background:var(--surface2);caret-color:transparent;}
  textarea#cin{color:transparent;background:var(--surface2);caret-color:var(--text);}

  /* STRENGTH */
  .strength-wrap{margin-top:6px;display:flex;gap:6px;align-items:center;}
  .strength-bar{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
  .strength-fill{height:100%;width:0%;transition:width .3s,background .3s;border-radius:2px;}
  .strength-label{font-size:11px;color:var(--text3);min-width:46px;text-align:right;font-weight:500;}

  /* RECOVERY PHRASE */
  .recovery-tools{margin-top:9px;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);}
  .recovery-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .recovery-note{font-size:11px;color:var(--text3);line-height:1.55;margin-top:8px;}
  .recovery-check{display:flex;align-items:flex-start;gap:8px;margin-top:9px;font-size:11px;color:var(--text2);line-height:1.45;cursor:pointer;}
  .recovery-check input{margin-top:2px;accent-color:var(--blue);}

  /* DROPZONE */
  .dropzone{
    width:100%;border:1.5px dashed var(--border);border-radius:var(--radius);
    background:var(--surface2);padding:1.6rem 1rem;
    text-align:center;cursor:pointer;transition:background .15s,border-color .15s;position:relative;
  }
  .dropzone:hover,.dropzone.drag{background:var(--blue-light);border-color:var(--blue);}
  .dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
  .dz-label{font-size:12px;color:var(--text2);}
  .dz-icon{font-size:22px;margin-bottom:6px;}
  .dz-file{font-size:13px;color:var(--blue);font-weight:500;margin-top:6px;}

  /* FILE RESULT */
  .file-result{
    border-radius:var(--radius-sm);padding:10px 14px;
    background:rgba(52,199,89,.1);border:1px solid rgba(52,199,89,.3);
    font-size:12px;color:var(--text);display:none;margin-top:4px;
  }
  .file-result.show{display:block;}
  .file-result b{color:var(--text);}

  /* BUTTON ROW */
  .brow{display:flex;gap:8px;margin-bottom:16px;}
  button.btn{
    font-family:inherit;font-size:14px;font-weight:500;
    padding:10px 20px;border:none;border-radius:980px;
    background:var(--surface2);color:var(--text);cursor:pointer;
    transition:background .15s,transform .1s;border:1.5px solid var(--border);
  }
  button.btn:hover{background:#e8e8ed;}
  button.btn:active{transform:scale(.97);}
  button.btn.inv{
    background:var(--blue);color:#fff;border-color:transparent;
  }
  button.btn.inv:hover{background:var(--blue-hover);}

  /* COPY BUTTON */
  button.btn-copy{
    font-family:inherit;font-size:12px;font-weight:500;
    padding:6px 14px;border:1.5px solid var(--border);border-radius:980px;
    background:var(--surface2);color:var(--text2);cursor:pointer;
    transition:background .15s,color .15s;
  }
  button.btn-copy:hover{background:var(--blue-light);color:var(--blue);border-color:var(--blue);}

  /* STATUS BAR */
  #sb{min-height:24px;margin-bottom:12px;cursor:default;}
  .bar{
    font-size:12px;font-weight:500;
    padding:7px 13px;border-radius:var(--radius-sm);
    display:inline-flex;align-items:center;gap:6px;
  }
  .ok{background:rgba(52,199,89,.12);color:#1a7a33;border:1px solid rgba(52,199,89,.25);}
  .ok::before{content:'✓  ';}

  /* PROGRESS */
  .prog-wrap{display:none;margin-bottom:12px;border-radius:4px;height:4px;background:var(--border);overflow:hidden;}
  .prog-wrap.show{display:block;}
  .prog-fill{height:100%;width:0%;background:var(--blue);transition:width .2s;border-radius:4px;}

  /* SECTION DIVIDER */
  .sec-divider{
    height:1px;background:var(--border);margin:0 -20px 16px;
  }
</style>
</head>
<body>

<div id="lock-overlay">
  <div id="lock-box">
    <div id="lock-title">Access Locked</div>
    <div id="lock-timer">10:00</div>
    <div id="lock-sub">Too many failed attempts — please wait</div>
  </div>
</div>

<div class="hdr">
  <canvas id="dog" width="24" height="24"></canvas>
</div>

<div class="card">

  <!-- 第一層：TEXT / FILE 切換 -->
  <div class="type-toggle">
    <button class="type-btn on" id="m-text" onclick="swMode('text')">文字</button>
    <button class="type-btn" id="m-file" onclick="swMode('file')">檔案</button>

  <!-- 自動偵測狀態列 -->

    <span class="action-desc" id="action-desc">貼入密文會自動切換為解密模式</span>
  </div>

  <div class="body">
    <div id="sb"></div>
    <div class="prog-wrap" id="prog"><div class="prog-fill" id="prog-fill"></div></div>

    <!-- TEXT MODE -->
    <div id="mode-text">
      <div class="field">

            <button class="btn-copy" type="button" onclick="copyRecovery('pw-unified')">複製</button>

        </div>
      </div>
      <div class="field">
        <div class="lbl" id="input-lbl">輸入文字</div>

          <div class="cipher-mask" id="cin-mask" style="display:none"></div>

      </div>
      <div class="brow">
        <button class="btn inv" id="main-action-btn" onclick="doUnified()">加密</button>
        <button class="btn" onclick="clearUnified()">清除</button>
      </div>
      <div class="field" id="output-field" style="display:none">

          <textarea class="ro" id="unified-output" readonly placeholder=""></textarea>

          <button class="btn-copy" onclick="cpTA('unified-output')">複製</button>

      <input type="hidden" id="pw-enc">
      <input type="hidden" id="pw-dec">

      <textarea id="cout" style="display:none"></textarea>
      <textarea id="cin" style="display:none"></textarea>

    <!-- FILE MODE -->
    <div id="mode-file" style="display:none">
      <div class="field">
        <div class="lbl" id="pw-label-file">英文復原詞</div>
        <input class="ipt" type="password" id="fpw-unified" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="8 個英文隨機詞＋1 個校驗詞" oninput="updateStrength(this.value,'sbar2','slbl2')">
        <div class="strength-wrap">
          <div class="strength-bar"><div class="strength-fill" id="sbar2"></div></div>
          <div class="strength-label" id="slbl2">—</div>
        </div>
        <div class="recovery-tools" id="recovery-tools-file">
          <div class="recovery-actions">
            <button class="btn-copy" type="button" onclick="generateRecovery('fpw-unified','confirm-recovery-file')">產生 8＋1 復原詞</button>
            <button class="btn-copy" id="toggle-recovery-file" type="button" onclick="toggleSecret('fpw-unified',this)">顯示</button>

            <button class="btn-copy" type="button" onclick="downloadRecovery('fpw-unified')">下載復原卡</button>

          <div class="recovery-note">使用 BIP-39 英文 2,048 詞庫產生 88-bit 隨機強度；請與 .enc 檔案分開保存。</div>
          <label class="recovery-check"><input type="checkbox" id="confirm-recovery-file"> <span>我已另外保存復原詞，並了解遺失後無法復原。</span></label>
        </div>
      </div>
      <div class="field">
        <div class="lbl" id="file-input-lbl">選擇檔案</div>
        <div class="dropzone" id="dz-unified"
          ondragover="dzOver(event,'dz-unified')" ondragleave="dzOut('dz-unified')" ondrop="dzDropUnified(event)">
          <input type="file" id="file-unified" onchange="fileSelectedUnified()">
          <div class="dz-label" id="dz-label-text">拖曳或點擊選擇檔案<br><span style="color:var(--text3);font-size:11px">.enc 檔案會自動切換為解密模式</span></div>
          <div class="dz-file" id="fname-unified"></div>
        </div>
      </div>
      <div class="brow">
        <button class="btn inv" id="file-action-btn" onclick="doFileUnified()">加密檔案</button>
        <button class="btn" onclick="clearFileUnified()">清除</button>
      </div>
      <div class="file-result" id="fenc-result">
        已加密：<b id="fenc-name"></b>
      </div>

        已解密：<b id="fdec-name"></b>
      </div>

      <input type="hidden" id="fpw-enc">

        <input type="file" id="file-enc">

        <span id="fname-dec"></span>
      </div>
    </div>
  </div>
</div>

<script>
// ── PIXEL APPLE-STYLE LAPTOP ──
(function(){
  const c=document.getElementById('dog'),ctx=c.getContext('2d');
  const B='#3d3b38',S='#b0a89e',D='#8c7a6e',L='#c8d4c0',_=null;

  const p=[
    _,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,
    _,_,_,_,_,B,B,B,B,B,B,B,B,B,B,B,B,B,_,_,_,_,_,_,
    _,_,_,_,B,S,S,S,S,S,S,S,S,S,S,S,S,S,B,_,_,_,_,_,
    _,_,_,B,S,L,L,L,L,L,L,L,L,L,L,L,L,L,S,B,_,_,_,_,
    _,_,_,B,S,L,L,L,L,L,L,L,L,L,L,L,L,L,S,B,_,_,_,_,
    _,_,_,B,S,L,L,L,L,L,L,L,L,L,L,L,L,L,S,B,_,_,_,_,
    _,_,_,B,S,L,L,L,L,L,B,B,L,L,L,L,L,L,S,B,_,_,_,_,
    _,_,_,B,S,L,L,L,L,B,B,B,B,L,L,L,L,L,S,B,_,_,_,_,
    _,_,_,B,S,L,L,L,L,L,B,B,L,L,L,L,L,L,S,B,_,_,_,_,
    _,_,_,_,B,S,S,S,S,S,S,S,S,S,S,S,S,S,B,_,_,_,_,_,
    _,_,_,_,_,B,B,B,B,B,B,B,B,B,B,B,B,B,_,_,_,_,_,_,
    _,_,_,_,_,_,_,_,B,B,B,B,B,B,_,_,_,_,_,_,_,_,_,_,
    _,_,_,_,B,B,B,B,B,B,B,B,B,B,B,B,B,B,B,_,_,_,_,_,
    _,_,_,B,D,D,D,D,D,D,D,D,D,D,D,D,D,D,D,B,_,_,_,_,
    _,_,B,D,D,D,D,D,D,D,D,D,D,D,D,D,D,D,D,D,B,_,_,_,
    _,B,B,B,B,B,B,B,B,B,B,B,B,B,B,B,B,B,B,B,B,B,_,_,
    _,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,
    _,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,
    _,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,
    _,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,
    _,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,
    _,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,
    _,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,
    _,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_
  ];

  for(let i=0;i<p.length;i++){
    if(!p[i]) continue;
    ctx.fillStyle=p[i];
    ctx.fillRect(i%24,Math.floor(i/24),1,1);
  }

  // breathing screen glow
  let bright=true;
  setInterval(()=>{
    bright=!bright;
    ctx.fillStyle=bright ? L : '#a8b8a0';
    for(let y=3;y<=8;y++){
      for(let x=5;x<=17;x++){
        if(!(y>=6 && y<=8 && x>=9 && x<=12)){
          ctx.fillRect(x,y,1,1);
        }
      }
    }
  },700);
})();

// ── STATE ──
let currentMode='text', unifiedFile=null, fileIsEnc=false, _clearTimer=null;
let cryptoReady=false, textIsLegacyMode=false, textCipherVersion=0, fileCipherVersion=0;
// 保留舊名稱供底層函式使用
let encFile=null, decFile=null;

// ── LOCK STATE ──
let failCount=0, lockUntil=0, lockInterval=null;

function isLocked(){return Date.now()<lockUntil;}

function recordFail(){
  if(isLocked())return;
  failCount++;
  if(failCount>=3){
    lockUntil=Date.now()+10*60*1000;
    failCount=0;
    showLock();
  } else {
    const left=3-failCount;
    stat(`Wrong password — ${left} attempt${left>1?'s':''} remaining`,'ok');
  }
}

function showLock(){
  const overlay=document.getElementById('lock-overlay');
  overlay.classList.add('show');
  updateLockTimer();
  lockInterval=setInterval(()=>{
    if(!isLocked()){
      overlay.classList.remove('show');
      clearInterval(lockInterval);lockInterval=null;
      stat('Lock released','ok');
    } else { updateLockTimer(); }
  },1000);
}

function updateLockTimer(){
  const rem=Math.max(0,Math.ceil((lockUntil-Date.now())/1000));
  const m=String(Math.floor(rem/60)).padStart(2,'0');
  const s=String(rem%60).padStart(2,'0');
  document.getElementById('lock-timer').textContent=`${m}:${s}`;
}

// ── STRENGTH ──
async function updateStrength(pw,barId,lblId){
  const bar=document.getElementById(barId),lbl=document.getElementById(lblId);
  const legacyUnlock=(barId==='sbar'&&textCipherVersion===3)||(barId==='sbar2'&&fileCipherVersion===3);
  if(legacyUnlock){bar.style.width='100%';bar.style.background='var(--border)';lbl.textContent='舊版密碼';return;}
  if(!pw){bar.style.width='0%';bar.style.background='var(--border)';lbl.textContent='—';return;}
  if(!window.CipherRecoveryPhrase){bar.style.width='25%';bar.style.background='var(--red)';lbl.textContent='無法驗證';return;}
  const snapshot=pw;
  const result=await CipherRecoveryPhrase.inspect(pw);
  const inputId=barId==='sbar'?'pw-unified':'fpw-unified';
  if(document.getElementById(inputId).value!==snapshot)return;
  bar.style.width=result.valid?'100%':'25%';
  bar.style.background=result.valid?'var(--green)':'var(--red)';
  lbl.textContent=result.valid?'88-bit':'需 8＋1 詞';
}

}

// ── 文字模式自動偵測 ──
// 新版密文使用明確前綴；舊 hex 格式只顯示不支援，不得再次加密。
function looksLikeCiphertext(val){
  return !!((window.CipherV4&&CipherV4.looksLikeV4Text(val))||(window.CipherV3&&CipherV3.looksLikeV3Text(val)));
}

let textIsDecMode=false;
function detectMode(val){
  const wasDecMode=textIsDecMode;
  textIsDecMode=looksLikeCiphertext(val);
  textCipherVersion=window.CipherV4&&CipherV4.looksLikeV4Text(val)?4:(window.CipherV3&&CipherV3.looksLikeV3Text(val)?3:0);
  textIsLegacyMode=!!(window.CipherV3&&CipherV3.looksLikeLegacyText(val));

  const btn=document.getElementById('main-action-btn');
  const inputLbl=document.getElementById('input-lbl');
  const inputTA=document.getElementById('unified-input');
  const outputField=document.getElementById('output-field');

  if(textIsLegacyMode){
    inputTA.classList.add('masked-cipher-input');
    updateCipherMask('unified-input','cin-mask',false,true);
    btn.textContent='舊版不支援';
    btn.style.background='var(--red)';
    btn.disabled=true;
    inputLbl.textContent='舊版密文';
    setRecoveryUi('text',false,false);
    setActionHint('idle','格式不支援','CIPHER2 與 PBKDF2 舊密文無法在 CIPHER4 解密');
    document.getElementById('unified-output').value='';
    outputField.style.display='none';
  } else if(textIsDecMode){
    inputTA.classList.add('masked-cipher-input');
    updateCipherMask('unified-input','cin-mask',false,true);
    btn.textContent='解密';
    btn.style.background='var(--green)';
    btn.disabled=!cryptoReady;
    inputLbl.textContent='密文';
    setRecoveryUi('text',false,textCipherVersion===3);
    updateStrength(document.getElementById('pw-unified').value,'sbar','slbl');
    setActionHint('dec','解密模式',textCipherVersion===3?'偵測到 CIPHER3，輸入原本密碼後解密':'偵測到 CIPHER4，貼上 8＋1 復原詞後解密');
    // 有輸出時清除（切換方向）
    if(!wasDecMode){ document.getElementById('unified-output').value=''; outputField.style.display='none'; }
  } else {
    inputTA.classList.remove('masked-cipher-input');
    updateCipherMask('unified-input','cin-mask',false,false);
    btn.textContent='加密';
    btn.style.background='';
    btn.disabled=!cryptoReady;
    inputLbl.textContent='輸入文字';
    setRecoveryUi('text',true,false);
    updateStrength(document.getElementById('pw-unified').value,'sbar','slbl');
    if(val.trim()==='') setActionHint('idle','等待輸入','產生 8＋1 復原詞後加密；貼入 CIPHER4: 可解密');
    else setActionHint('enc','加密模式','使用 8＋1 復原詞進行 88-bit 中等保護');
    if(wasDecMode){ document.getElementById('unified-output').value=''; outputField.style.display='none'; }
  }
}

// ── 文字：統一執行 ──
async function doUnified(){
  const pw=document.getElementById('pw-unified').value;
  const input=document.getElementById('unified-input').value;
  const btn=document.getElementById('main-action-btn');
  if(textIsLegacyMode){stat('CIPHER2 與 PBKDF2 舊密文不受支援','ok');return;}
  if(!cryptoReady){stat('Argon2id 模組尚未就緒','ok');return;}
  if(!pw){stat(textCipherVersion===3?'請輸入舊版密碼':'請貼上或產生 8＋1 復原詞','ok');return;}
  if(!input.trim()){stat('請輸入文字','ok');return;}

  const outputField=document.getElementById('output-field');
  const outputTA=document.getElementById('unified-output');
  const outputLbl=document.getElementById('output-lbl');

  if(textIsDecMode){
    if(isLocked()){showLock();return;}
    updateCipherMask('unified-output','cout-mask',true,false);
    btn.disabled=true;
    btn.textContent='正在衍生金鑰…';
    stat('正在使用 Argon2id 衍生金鑰','ok');
    try{
      const cipher=textCipherVersion===3?CipherV3:CipherV4;
      const plain=await cipher.decryptText(input,pw);
      outputTA.style.color='';
      outputTA.value=plain;
      outputLbl.textContent='解密結果';
      outputField.style.display='';
      updateCipherMask('unified-output','cout-mask',true,false);
      failCount=0;
      stat('解密完成','ok');
      startClearCountdown();
    }catch(e){
      console.error(e);
      if(e&&e.code==='AUTH_FAILED') recordFail();
      outputTA.value=e&&e.code==='LEGACY_FORMAT'
        ?'CIPHER2 與 PBKDF2 舊密文不受支援'
        :(e&&['INVALID_WORD_COUNT','UNKNOWN_WORD','CHECKSUM_MISMATCH'].includes(e.code)?e.message:'解密失敗 — 復原詞／密碼錯誤、格式無效或資料已損毀');
      outputTA.style.color=var_red();
      outputField.style.display='';
    }finally{
      detectMode(input);
    }
  } else {
    const recovery=await requireRecovery('pw-unified','confirm-recovery-text');
    if(!recovery)return;
    btn.disabled=true;
    btn.textContent='正在衍生金鑰…';
    stat('正在使用 Argon2id 衍生金鑰','ok');
    try{
      const ciphertext=await CipherV4.encryptText(input,recovery);
      outputTA.style.color='';
      outputTA.value=ciphertext;
      outputLbl.textContent='加密結果（密文）';
      outputField.style.display='';
      updateCipherMask('unified-output','cout-mask',true);
      stat('加密完成','ok');
      startClearCountdown();
    }catch(e){
      console.error(e);
      stat('加密失敗 — Argon2id 或 Web Crypto 無法使用','ok');
    }finally{
      detectMode(input);
    }
  }
}

async function identifyEncryptedFile(file){
  fileCipherVersion=0;
  if(!file||!file.name.toLowerCase().endsWith('.enc')){setRecoveryUi('file',true,false);return;}
  try{
    const head=await file.slice(0,8).arrayBuffer();
    if(CipherV4.isV4File(head))fileCipherVersion=4;
    else if(CipherV3.isV3File(head))fileCipherVersion=3;
  }catch(e){console.warn('Unable to inspect encrypted file header',e);}
  setRecoveryUi('file',false,fileCipherVersion===3);
  updateStrength(document.getElementById('fpw-unified').value,'sbar2','slbl2');
}

async function downloadBuf(buf,filename,mimeType){
  mimeType=mimeType||'application/octet-stream';
  const blob=new Blob([buf],{type:mimeType});

  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
  const isAndroid=/Android/.test(navigator.userAgent);

  // iOS: Web Share API is the only reliable way to save files
  if(isIOS){
    // Web Share API with files — supported iOS 15+
    if(navigator.canShare && navigator.share){
      const file=new File([blob],filename,{type:mimeType});
      if(navigator.canShare({files:[file]})){
        try{
          await navigator.share({files:[file],title:filename});
          return;
        }catch(e){
          // User cancelled share — not an error
          if(e.name==='AbortError') return;
        }
      }
    }
    // Fallback: open blob in new tab, user long-presses to save
    const url=URL.createObjectURL(blob);
    window.open(url,'_blank');
    stat('Long-press the file to save','ok');
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    return;
  }

  // Android: try Web Share API first, fallback to anchor download
  if(isAndroid && navigator.canShare && navigator.share){
    const file=new File([blob],filename,{type:mimeType});
    if(navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file],title:filename});
        return;
      }catch(e){
        if(e.name==='AbortError') return;
      }
    }
  }

  // Desktop / fallback
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

// ── EXIF STRIP ──
// 只處理 JPEG（SOI = FF D8）。
// JPEG 由數個 segment 組成，每段格式為：marker(2) + length(2) + data
// APP1（FF E1）通常是 EXIF，APP2~APP15 也可能含元數據，一律移除。
// 保留 SOI、DQT、SOF、DHT、SOS 及之後的影像資料。
function stripExif(arrayBuffer) {
  const data = new DataView(arrayBuffer);

  // 確認是 JPEG（FF D8）
  if (data.byteLength < 4 || data.getUint8(0) !== 0xFF || data.getUint8(1) !== 0xD8) {
    return arrayBuffer; // 非 JPEG，原樣返回
  }

  const out = [new Uint8Array([0xFF, 0xD8])]; // 保留 SOI
  let offset = 2;

  while (offset < data.byteLength - 1) {
    // 找下一個 marker（必須是 FF 開頭）
    if (data.getUint8(offset) !== 0xFF) break;

    const marker = data.getUint8(offset + 1);

    // SOS（FF DA）開始後是壓縮影像資料，直接取到結尾
    if (marker === 0xDA) {
      out.push(new Uint8Array(arrayBuffer, offset));
      break;
    }

    // EOI（FF D9）
    if (marker === 0xD9) {
      out.push(new Uint8Array([0xFF, 0xD9]));
      break;
    }

    // standalone markers（無 length 欄位）
    if (marker === 0xD8 || (marker >= 0xD0 && marker <= 0xD7)) {
      out.push(new Uint8Array([0xFF, marker]));
      offset += 2;
      continue;
    }

    if (offset + 3 >= data.byteLength) break;
    const segLen = data.getUint16(offset + 2); // includes the 2-byte length field itself
    const segEnd = offset + 2 + segLen;

    // APP1~APP15（FF E1 ~ FF EF）：EXIF / XMP / ICC 等元數據，跳過
    if (marker >= 0xE1 && marker <= 0xEF) {
      offset = segEnd;
      continue;
    }

    // 其他 segment 保留（APP0/JFIF、DQT、SOF、DHT 等）
    out.push(new Uint8Array(arrayBuffer, offset, 2 + segLen));
    offset = segEnd;
  }

  // 合併所有保留的 segment
  const total = out.reduce((s, a) => s + a.byteLength, 0);
  const result = new Uint8Array(total);
  let pos = 0;
  for (const chunk of out) { result.set(chunk, pos); pos += chunk.byteLength; }
  return result.buffer;
}

async function doFileEnc(){
  const pw=document.getElementById('fpw-unified').value;
  const btn=document.getElementById('file-action-btn');

  if(!cryptoReady){stat('Argon2id 模組尚未就緒','ok');return;}
  if(!pw){stat('請產生 8＋1 復原詞','ok');return;}
  if(!encFile){stat('請選擇檔案','ok');return;}
  const recovery=await requireRecovery('fpw-unified','confirm-recovery-file');
  if(!recovery)return;

  try{
    setProgBar(5);
    btn.disabled=true;
    btn.textContent='正在衍生金鑰…';
    stat('正在使用 Argon2id 衍生金鑰','ok');

    // 判斷是否為 JPEG，是的話先讀整個檔案 strip EXIF，再分 chunk 加密
    const isJpeg = /\.(jpe?g)$/i.test(encFile.name) ||
                   encFile.type === 'image/jpeg';
    let sourceBlob = encFile;

    if (isJpeg) {
      stat('正在移除 EXIF metadata','ok');
      const raw = await encFile.arrayBuffer();
      sourceBlob = new Blob([stripExif(raw)],{type:encFile.type||'image/jpeg'});
    }

    const finalBuf=await CipherV4.encryptFile(sourceBlob,recovery,{
      name:encFile.name,
      type:encFile.type||'application/octet-stream',
      onProgress:ratio=>setProgBar(Math.max(10,Math.floor(ratio*90)))
    });

    await downloadBuf(
      finalBuf,
      encFile.name + '.enc',
      'application/octet-stream'
    );

    setProgBar(100);
    setTimeout(()=>setProgBar(null),1000);

    document.getElementById('fenc-name').textContent=encFile.name+'.enc';
    document.getElementById('fenc-result').classList.add('show');

    stat('檔案加密完成','ok');
    startClearCountdown();

  }catch(e){
    console.error(e);
    setProgBar(null);
    stat('檔案加密失敗','ok');
  }finally{
    btn.disabled=!cryptoReady;
    btn.textContent='加密檔案';
  }
}



async function doFileDec(){

  if(isLocked()){showLock();return;}
  const pw=document.getElementById('fpw-unified').value;
  const btn=document.getElementById('file-action-btn');

  const errEl=document.getElementById('fdec-err');

  errEl.classList.remove('show');
  errEl.textContent='';

  document.getElementById('fdec-result').classList.remove('show');

  if(!cryptoReady){showFileErr('Argon2id 模組尚未就緒');return;}
  if(!pw){showFileErr(fileCipherVersion===3?'請輸入舊版密碼':'請貼上 8＋1 復原詞');return;}
  if(!decFile){showFileErr('請選擇檔案');return;}

  try{
    setProgBar(5);
    btn.disabled=true;
    btn.textContent='正在驗證並解密…';
    const raw=await decFile.arrayBuffer();
    let cipher;
    if(CipherV4.isV4File(raw))cipher=CipherV4;
    else if(CipherV3.isV3File(raw))cipher=CipherV3;
    else if(CipherV3.isLegacyFile(raw))throw new CipherV4.CipherV4Error('LEGACY_FORMAT','Legacy file');
    else throw new CipherV4.CipherV4Error('INVALID_MAGIC','Invalid file');
    stat('正在使用 Argon2id 衍生金鑰','ok');
    const result=await cipher.decryptFile(raw,pw,{
      onProgress:ratio=>setProgBar(Math.max(10,Math.floor(ratio*90)))
    });

    await downloadBuf(
      result.buffer,
      result.name,
      result.type
    );

    setProgBar(100);

    setTimeout(()=>setProgBar(null),1000);

    document.getElementById('fdec-name').textContent=result.name;

    document.getElementById('fdec-result').classList.add('show');

    failCount=0;
    stat('檔案解密完成','ok');

    startClearCountdown();

  }catch(e){

    console.error(e);

    setProgBar(null);

    if(e&&e.code==='AUTH_FAILED') recordFail();
    if(e&&e.code==='LEGACY_FORMAT') showFileErr('舊版 PBKDF2 加密檔案不受支援');
    else if(e&&e.code==='INVALID_MAGIC') showFileErr('不是有效的 CIPHER4 或 CIPHER3 加密檔案');
    else if(e&&['INVALID_WORD_COUNT','UNKNOWN_WORD','CHECKSUM_MISMATCH'].includes(e.code)) showFileErr(e.message);
    else showFileErr('解密失敗 — 復原詞／密碼錯誤、格式無效或檔案已遭修改');
  }finally{
    btn.disabled=!cryptoReady;
    btn.textContent='解密檔案';
  }
}


function showFileErr(msg){
  const el=document.getElementById('fdec-err');
  el.textContent=msg;el.classList.add('show');
  el.style.color=var_red();el.style.whiteSpace='pre';
}

// ── COPY / CLEAR ──
function cpTA(id){
  const el=document.getElementById(id);
  const text=el.value.trim();
  if(!text){stat('Nothing to copy','ok');return;}
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>stat('Copied','ok')).catch(()=>fallbackCopy(text));
  } else{fallbackCopy(text);}
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.cssText='position:fixed;top:-9999px;left:-9999px;opacity:0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');stat('Copied','ok');}catch(e){stat('Copy failed — select manually','ok');}
  document.body.removeChild(ta);
}
function clearEnc(){ clearUnified(); }
function clearDec(){ clearUnified(); }
function clearFileEnc(){ clearFileUnified(); }
function clearFileDec(){ clearFileUnified(); }
function updateCipherMask(taId,maskId,isRo,shouldMask=true){
  const ta=document.getElementById(taId);
  const mask=document.getElementById(maskId);
  if(!ta||!mask){return;}
  if(!shouldMask){
    mask.textContent='';
    mask.style.display='none';
    return;
  }
  mask.style.display='';
  const val=ta.value;
  if(!val){mask.textContent='';return;}
  mask.textContent='*'.repeat(Math.min(val.length,300));
}

    cryptoReady=false;
    textBtn.disabled=true;

    stat('Argon2id 模組載入失敗，加解密功能已停用','ok');
  }
});
